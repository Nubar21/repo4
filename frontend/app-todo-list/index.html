<!DOCTYPE html>
<html lang="ru">
    <head>
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Мой todo list</title>
     <meta name="viewport" content="width=device-width, initial-scale=1">
     <link rel="stylesheet" href="styles.css" />
     </head>

<body>
<div class="todo">
        <div class="todo__box">
            <h2 class="todo__title">Список задач</h2>
            <form id="todo-form" class="todo__row">
                <input id="todo-input" class="todo-input" type="text" placeholder="Введите задачу">
                <button class="todo-btn">Добавить</button>
            </form>
            <ul id="todo-list" class="todo__list">
            </ul>
        </div>
    </div>


<script src="code.js"></script>
 </body>
   
</html>
